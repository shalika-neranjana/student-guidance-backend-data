<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Results Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="hero-copy">
                <h1>Student Results Dashboard</h1>
                <p class="subtitle">Manage continuous assessment marks with faster filtering, clearer feedback, and fewer accidental mistakes.</p>
            </div>
            <span class="pill" id="resultCount" aria-live="polite">0 results</span>
        </div>

        <div id="statusBanner" class="status-banner" role="status" aria-live="polite"></div>

        <div class="panel">
            <div class="header">
                <div class="filters">
                    <div class="field-block">
                        <label for="studentFilter">Student</label>
                        <select id="studentFilter"></select>
                        <div class="field-help">Choose a student first to view or add results.</div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="field-block">
                        <label for="searchInput">Search module</label>
                        <input type="text" id="searchInput" class="search" placeholder="Search by module name or code">
                    </div>
                    <button class="btn-action" id="clearSearchBtn" type="button">Clear</button>
                    <button class="btn-primary" id="newResultBtn" type="button">+ New Result</button>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>CA</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="formTitle">
            <h3 id="formTitle">Add Result</h3>
            <p class="subtitle" id="selectedStudentLabel">Select a student to continue.</p>

            <div class="form-group">
                <label for="module">Module</label>
                <select id="module"></select>
            </div>

            <div class="form-group">
                <label for="caMarks">CA Marks</label>
                <input type="number" id="caMarks" placeholder="0 - 100" min="0" max="100" inputmode="numeric">
                <div id="caError" class="form-error" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="grade">Grade</label>
                <select id="grade">
                    <option value="">Select a grade</option>
                    <option>A+</option>
                    <option>A</option>
                    <option>B+</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                    <option>E</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn-action" id="cancelBtn" type="button">Cancel</button>
                <button class="btn-primary" id="saveBtn" type="button">Save Result</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
